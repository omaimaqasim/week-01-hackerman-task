<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hackerman</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      background-color: black;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
    }
    div {
      white-space: pre-line;
      font-size: 1.7rem;
      padding: 10px;
      line-height: 2;
    }
  </style>
</head>
<body>
  
  <script>
  function randomDelay() {
    let timeout = 1 + 6 * Math.random(); // 1 to 7 seconds
    return new Promise((resolve) => {
      setTimeout(resolve, timeout * 1000);
    });
  }
  async function hackerman(comment) {
    await randomDelay();
    let div = document.createElement("div");
    div.innerHTML = comment;
    document.body.append(div);
  }


  async function main() {

    setInterval(() => {
      let last =   document.body.lastElementChild //  that is current div
      if (last.innerHTML.endsWith("...")) {
        last.innerHTML = last.innerHTML.slice(0,last.innerHTML.length-3)
      }
      else{

        last.innerHTML = last.innerHTML + "."
      }
    }, 700);


    

  let comments = [
    "Initializing Hack program",
    "Hacking zain's username",
    "Username found: zainAli_1234",
    "Connecting to Facebook",
    "Connection established ✅"
  ];
    for (const comment of comments) {
      await hackerman(comment); // ✅ Wait for each step
    }
  }

  main(); 
</script>

</body>
</html>
