<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hackerman</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      background-color: black;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
    }
    div {
      white-space: pre-line;
      font-size: 1.7rem;
      padding: 10px;
      line-height: 2;
    }
  </style>
</head>
<body>

<script>
  async function hackerman(comment) {
    await randomDelay();
    let div = document.createElement("div");
    div.innerHTML = comment;
    document.body.append(div);
  }

  function randomDelay() {
    let timeout = 1 + 6 * Math.random(); // 1 to 7 seconds
    return new Promise((resolve) => {
      setTimeout(resolve, timeout * 1000);
    });
  }

  let comments = [
    "Initializing Hack program...\n",
    "Hacking zain's username...\n",
    "Username found: zainAli_1234...\n",
    "Connecting to Facebook...\n",
    "Connection established ✅\n"
  ];

  async function startHacking() {
    for (const comment of comments) {
      await hackerman(comment); // ✅ Wait for each step
    }
  }

  startHacking(); 
</script>

</body>
</html>
